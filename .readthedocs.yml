version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    install:
      - python -m pip install "pip>=26.3"
      - python -m pip install --group pylock.dev.toml:docs --group pylock.dev.toml:build
      - python -m pip install --no-deps --no-build-isolation .

sphinx:
  builder: dirhtml
  configuration: docs/html/conf.py
