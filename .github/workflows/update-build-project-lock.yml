name: Update lock files

on:
  schedule:
    - cron: 0 5 * * MON # Run every Monday at 05:00
  workflow_dispatch:
    # allow manual runs

env:
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-build-project-lock:
    if: github.repository_owner == 'pypa'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # because we'll git push

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - run: python -m pip install .
      - run: python -m pip install --group pylock.dev.toml:bootstrap

      - name: Update development and script locks
        run: python -m nox -s lock -- --upgrade

      - name: Update the build-project lock
        working-directory: build-project
        run: "python -m pip lock --group build --uploaded-prior-to P3D --only-binary=:all:"

      - name: Test the build works with the new lock file
        run: python build-project/build-project.py

      - name: Create a pull request if the locks changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/create_lock_update_pr.sh
